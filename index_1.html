ะบายไปเท่าไร เขียนเป็นทศนิยม?",visual:{kind:"grid",n:7},type:"choice",options:["0.07","0.7","7.0","0.70"],answer:"0.07",hint:"ไม่มีแถวไหนเต็มเลยสักแถว แสดงว่าหลักส่วนสิบต้องเป็น 0",explain:"ระบาย 7 ช่องจาก 100 ช่อง = 7/100 = 0.07"},{ask:"1 บาท เท่ากับกี่สตางค์?",type:"input",answer:"100",unit:"สตางค์",hint:"ลองนึกถึงตารางร้อยช่องที่เพิ่งระบายไป",explain:"1 บาท = 100 สตางค์ เหมือนของ 1 ชิ้นถูกซอยเป็น 100 ส่วน"},{ask:"75 สตางค์ เขียนเป็นบาทได้เท่าไร?",type:"input",answer:"0.75",unit:"บาท",hint:"ยังไม่ถึง 1 บาท ดังนั้นเลขหน้าจุดคือ 0",explain:"75 สตางค์ = 75/100 บาท = 0.75 บาท"},{ask:"0.5 บาท กับ 0.50 บาท เท่ากันหรือไม่?",type:"choice",options:["เท่ากัน คือ 50 สตางค์","ไม่เท่า 0.50 มากกว่า","ไม่เท่า 0.5 มากกว่า","เทียบไม่ได้"],answer:"เท่ากัน คือ 50 สตางค์",hint:"5 แถวเต็ม กับ 50 ช่อง เป็นพื้นที่เท่ากันในตารางร้อยช่อง",explain:"การเติมศูนย์ท้ายทศนิยมไม่ทำให้ค่าเปลี่ยน 0.5 = 0.50"}]}]},{id:4,name:"รู้จัก 0.001",goal:"เข้าใจหลักส่วนพัน และทศนิยม 3 ตำแหน่ง",emoji:"🧊",classroom:"ใช้เครื่องชั่งดิจิทัลชั่งของในห้อง แล้วให้เด็กอ่านค่าเป็นกรัมและแปลงเป็นกิโลกรัม",steps:[{kind:"C",title:"ซอยเป็นครั้งที่สาม",body:["ถ้าเอาชิ้นจิ๋ว 0.01 มาซอยอีก 10 ส่วน จะได้ชิ้นที่เล็กมาก ๆ","กดหักสามครั้ง แล้วดูว่าทั้งแท่งถูกซอยเป็นกี่ชิ้น"],widget:{name:"ChocoSplit",props:{maxDepth:3}},examples:[{show:"1 → 10 → 100 → 1,000",say:"ทุกครั้งที่หัก จำนวนชิ้นเพิ่มขึ้น 10 เท่า"},{show:"1 กิโลกรัม → 1,000 กรัม",say:"เครื่องชั่งซอยน้ำหนักแบบเดียวกัน"},{show:"1 เมตร → 1,000 มิลลิเมตร",say:"ขีดเล็กที่สุดบนไม้บรรทัดคือมิลลิเมตร"}],tip:"ทุกครั้งที่หัก จำนวนชิ้นเพิ่มขึ้น 10 เท่า: 1 → 10 → 100 → 1,000"},{kind:"P",title:"กองพันช่อง",body:["เอาตารางร้อยช่องมาวางซ้อน 10 แผ่น จะได้ทั้งหมด 1,000 ช่อง","กดปุ่ม +/- เพื่อเปลี่ยนจำนวนช่องที่ระบาย แล้วสังเกตตัวเลขทศนิยม"],widget:{name:"ThousandStack"},examples:[{show:"1 แผ่นเต็ม = 0.100",say:"100 ช่องจาก 1,000 ช่อง ซึ่งเท่ากับ 0.1"},{show:"125 ช่อง = 0.125",say:"1 แผ่นเต็ม กับอีก 25 ช่อง"}],tip:"แผ่นเต็ม 1 แผ่น = 100 ช่อง = 0.100 ซึ่งเท่ากับ 0.1 นั่นเอง"},{kind:"A",title:"ทศนิยม 3 ตำแหน่ง",body:["นับตำแหน่งหลังจุดจากซ้ายไปขวา: ตัวที่ 1 ส่วนสิบ, ตัวที่ 2 ส่วนร้อย, ตัวที่ 3 ส่วนพัน"],examples:[{show:"0.001",say:"ศูนย์จุดศูนย์ศูนย์หนึ่ง = 1/1000"},{show:"0.125",say:"ศูนย์จุดหนึ่งสองห้า = 125/1000 (เท่ากับ 1 ใน 8)"},{show:"0.250",say:"250 กรัม = 0.250 กิโลกรัม (1 กิโลกรัม = 1,000 กรัม)"},{show:"3.045",say:"สามจุดศูนย์สี่ห้า = เต็ม 3 กับอีก 45/1000"}],warn:"จำนวนตัวเลขหลังจุดบอกว่าแบ่งเป็นกี่ส่วน: 1 ตัว = สิบส่วน, 2 ตัว = ร้อยส่วน, 3 ตัว = พันส่วน"},{kind:"Q",title:"ลองทำเอง",body:[],quiz:[{ask:"แบ่งของ 1 ชิ้นเป็น 1,000 ส่วนเท่ากัน 1 ส่วนเขียนเป็นทศนิยมได้อย่างไร?",type:"choice",options:["0.001","0.01","0.1","1.000"],answer:"0.001",hint:"พันส่วนต้องใช้เลขหลังจุด 3 ตัว",explain:"1/1000 = 0.001 มีเลขหลังจุด 3 ตัว"},{ask:"1 กิโลกรัม = 1,000 กรัม แล้ว 250 กรัม เขียนเป็นกิโลกรัม (ทศนิยม 3 ตำแหน่ง) ได้เท่าไร?",type:"input",answer:"0.250",unit:"กิโลกรัม",hint:"250 จาก 1,000 ส่วน → เขียนเลขหลังจุดให้ครบ 3 ตัว",explain:"250/1000 = 0.250 กิโลกรัม (เท่ากับ 0.25 กิโลกรัม)"},{ask:"“สามส่วนพัน” เขียนเป็นทศนิยมได้อย่างไร?",type:"choice",options:["0.003","0.03","0.3","3.000"],answer:"0.003",hint:"ต้องเติมศูนย์คั่นให้เลข 3 ไปอยู่ตำแหน่งที่ 3 หลังจุด",explain:"3/1000 = 0.003 — เลข 3 ต้องอยู่หลักส่วนพัน จึงต้องมี 0 คั่นสองตัว"},{ask:"45/1000 เขียนเป็นทศนิยมได้เท่าไร?",type:"input",answer:"0.045",hint:"เลข 45 ต้องจบที่ตำแหน่งที่ 3 หลังจุด",explain:"45/1000 = 0.045"},{ask:"ในจำนวน 2.607 เลข 7 อยู่ในหลักใด?",type:"choice",options:["ส่วนพัน","ส่วนร้อย","ส่วนสิบ","หน่วย"],answer:"ส่วนพัน",hint:"นับตำแหน่งหลังจุดจากซ้ายไปขวา",explain:"หลังจุดคือ 6 (ส่วนสิบ), 0 (ส่วนร้อย), 7 (ส่วนพัน)"}]}]},{id:5,name:"ค่าประจำหลัก",goal:"บอกค่าของเลขแต่ละหลัก และเขียนจำนวนในรูปกระจาย",emoji:"🏛️",classroom:"ทำตารางหลักขนาดใหญ่ติดกระดาน แล้วให้เด็กออกมาวางบัตรตัวเลขในช่องที่ถูกต้อง",steps:[{kind:"C",title:"แยกเงินเป็นกอง ๆ",body:["เวลานับเงิน เราแยกเป็นกอง: กองสิบบาท กองบาท กองสตางค์","การแยกกองแบบนี้แหละ คือความคิดเรื่อง “หลัก” ลองหยอดเหรียญดู"],widget:{name:"MoneyBoard"},examples:[{show:"เหรียญ 10 บาท 2 เหรียญ",say:"อยู่กองหลักสิบ รวมมีค่า 20"},{show:"เหรียญ 1 บาท 3 เหรียญ",say:"อยู่กองหลักหน่วย รวมมีค่า 3"},{show:"เหรียญ 50 สตางค์ 1 เหรียญ",say:"อยู่หลังจุด มีค่า 0.50"}],tip:"เหรียญชนิดเดียวกันอยู่กองเดียวกัน เพราะมีค่าเท่ากัน — ตัวเลขในหลักเดียวกันก็เช่นกัน"},{kind:"P",title:"ตารางหลักสี",body:["แต่ละหลักมีสีประจำตัว ใช้สีเดียวกันนี้ตลอดทั้งบทเรียน","กดลูกศรเปลี่ยนตัวเลขในแต่ละหลัก แล้วดูว่าจำนวนเปลี่ยนไปอย่างไร"],widget:{name:"PlaceChart",props:{initial:[0,3,4,5,0]}},examples:[{show:"2.35",say:"2 หน่วย, 3 ส่วนสิบ, 5 ส่วนร้อย"},{show:"0.07",say:"ไม่มีหน่วย ไม่มีส่วนสิบ มีแค่ 7 ส่วนร้อย"}],tip:"ยิ่งไปทางขวา ค่าประจำหลักยิ่งเล็กลง 10 เท่าเสมอ"},{kind:"A",title:"เขียนในรูปกระจาย",body:["เลขตัวเดียวกัน อยู่คนละหลัก มีค่าไม่เท่ากัน ตัวเลขบอก “จำนวน” ส่วนหลักบอก “ค่า”"],examples:[{show:"3.45 = 3 + 0.4 + 0.05",say:"เลข 4 อยู่หลักส่วนสิบ มีค่า 0.4 / เลข 5 อยู่หลักส่วนร้อย มีค่า 0.05"},{show:"0.62 = 0.6 + 0.02",say:"ไม่มีจำนวนเต็ม จึงเริ่มที่หลักส่วนสิบ"},{show:"7.108 = 7 + 0.1 + 0.008",say:"หลักส่วนร้อยเป็น 0 จึงไม่ต้องเขียนในรูปกระจาย"}],warn:"ใน 4.62 เลข 6 ไม่ได้มีค่า 6 แต่มีค่า 0.6 เพราะอยู่ในหลักส่วนสิบ"},{kind:"Q",title:"ลองทำเอง",body:[],quiz:[{ask:"ในจำนวน 4.62 เลข 6 อยู่ในหลักใด?",type:"choice",options:["ส่วนสิบ","ส่วนร้อย","หน่วย","สิบ"],answer:"ส่วนสิบ",hint:"ตัวแรกหลังจุดคือหลักส่วนสิบเสมอ",explain:"เลข 6 อยู่ตำแหน่งแรกหลังจุด จึงอยู่หลักส่วนสิบ"},{ask:"ในจำนวน 4.62 เลข 2 มีค่าเท่าใด?",type:"choice",options:["0.02","2","0.2","20"],answer:"0.02",hint:"เลข 2 อยู่หลักส่วนร้อย ค่าประจำหลักคือ 0.01",explain:"เลข 2 อยู่หลักส่วนร้อย จึงมีค่า 2 × 0.01 = 0.02"},{ask:"3 + 0.4 + 0.05 เขียนเป็นทศนิยมได้เท่าไร?",type:"input",answer:"3.45",hint:"เอาแต่ละส่วนไปใส่ตามหลักของมัน",explain:"3 อยู่หลักหน่วย, 4 อยู่ส่วนสิบ, 5 อยู่ส่วนร้อย → 3.45"},{ask:"ในจำนวน 7.108 เลขใดอยู่ในหลักส่วนพัน?",type:"choice",options:["8","1","0","7"],answer:"8",hint:"นับหลังจุดไปตัวที่ 3",explain:"หลังจุดคือ 1 (ส่วนสิบ), 0 (ส่วนร้อย), 8 (ส่วนพัน)"},{ask:"0.9 มีค่าเท่ากับกี่ส่วนร้อย?",type:"choice",options:["90 ส่วนร้อย","9 ส่วนร้อย","0.09 ส่วนร้อย","900 ส่วนร้อย"],answer:"90 ส่วนร้อย",hint:"ลองเขียน 0.9 ใหม่เป็น 0.90 แล้วดูตารางร้อยช่อง",explain:"0.9 = 0.90 = 90/100 คือ 90 ส่วนร้อย"}]}]},{id:6,name:"ทศนิยมบนเส้นจำนวน",goal:"บอกตำแหน่งของทศนิยมบนเส้นจำนวน และอ่านค่าจากขีดได้",emoji:"📏",classroom:"ขึงเชือกยาวหน้าห้องเป็นเส้นจำนวน แล้วให้เด็กถือบัตรตัวเลขไปหนีบตามตำแหน่งของตัวเอง",steps:[{kind:"C",title:"ไม้บรรทัดคือเส้นจำนวน",body:["ไม้บรรทัด 1 เมตร ถูกซอยเป็น 100 ช่อง ช่องละ 1 เซนติเมตร","เลื่อนแถบดู แล้วสังเกตว่าเซนติเมตรกลายเป็นทศนิยมของเมตรอย่างไร"],widget:{name:"Ruler"},examples:[{show:"35 ซม. = 0.35 ม.",say:"35 ช่องจาก 100 ช่องของหนึ่งเมตร"},{show:"50 ซม. = 0.50 ม.",say:"ครึ่งเมตรพอดี"},{show:"8 ซม. = 0.08 ม.",say:"ยังไม่ถึงหนึ่งในสิบของเมตร จึงมี 0 คั่น"}],tip:"ของที่วัดได้ในชีวิตจริงมักไม่ลงตัวพอดี ทศนิยมจึงมีไว้บอก “เศษที่เหลือ”"},{kind:"P",title:"ซูมเข้าไปดูระหว่างขีด",body:["ระหว่าง 0 กับ 1 มีทศนิยมซ่อนอยู่เต็มไปหมด","แตะช่องว่างเหนือเส้นเพื่อซูมเข้าไปดูระหว่างขีดสองขีด ซูมได้ 2 ครั้ง"],widget:{name:"NumberLineZoom"},examples:[{show:"ซูมชั้นที่ 1",say:"ช่วง 0 ถึง 1 แบ่งเป็น 10 ขีด ขีดละ 0.1"},{show:"ซูมชั้นที่ 2",say:"ช่วง 0.3 ถึง 0.4 แบ่งอีก 10 ขีด ขีดละ 0.01"},{show:"ซูมชั้นที่ 3",say:"ช่วง 0.34 ถึง 0.35 แบ่งอีก 10 ขีด ขีดละ 0.001"}],tip:"ซูมครั้งแรกได้ขีดละ 0.01 ซูมอีกครั้งได้ขีดละ 0.001 — ยิ่งซูมยิ่งเห็นตัวเลขละเอียดขึ้น"},{kind:"A",title:"อ่านค่าจากขีด",body:["ก่อนอ่านค่า ให้ดูก่อนว่าช่วงหนึ่งช่องถูกแบ่งเป็นกี่ขีดย่อย"],examples:[{show:"0.3",say:"อยู่ระหว่าง 0 กับ 1 นับจาก 0 ไป 3 ขีด (ขีดละ 0.1)"},{show:"0.35",say:"อยู่กึ่งกลางระหว่าง 0.3 กับ 0.4"},{show:"1.6",say:"อยู่ระหว่าง 1 กับ 2 นับจาก 1 ไป 6 ขีด"}],warn:"อย่าเพิ่งนับขีด ให้ดูตัวเลขกำกับสองตัวที่ใกล้ที่สุดก่อนเสมอ"},{kind:"Q",title:"ลองทำเอง",body:[],quiz:[{ask:"ลูกศรชี้ที่จำนวนใด?",visual:{kind:"line",lo:0,step:.1,mark:.3,dp:1},type:"choice",options:["0.3","3","0.03","0.7"],answer:"0.3",hint:"นับจาก 0 ไปทีละขีด แต่ละขีดคือ 0.1",explain:"นับไป 3 ขีดจาก 0 ได้ 0.3"},{ask:"ลูกศรชี้ที่จำนวนใด?",visual:{kind:"line",lo:0,step:.1,mark:.7,dp:1},type:"input",answer:"0.7",hint:"ช่วง 0 ถึง 1 ถูกแบ่งเป็น 10 ขีด",explain:"นับไป 7 ขีดจาก 0 ได้ 0.7"},{ask:"ลูกศรชี้ที่จำนวนใด?",visual:{kind:"line",lo:.2,step:.01,mark:.24,dp:2},type:"choice",options:["0.24","0.4","2.4","0.204"],answer:"0.24",hint:"ดูตัวเลขกำกับที่ปลายซ้ายก่อน แล้วนับขีดทีละ 0.01",explain:"เริ่มที่ 0.20 นับไป 4 ขีด ขีดละ 0.01 ได้ 0.24"},{ask:"0.35 อยู่ระหว่างจำนวนคู่ใด?",type:"choice",options:["0.3 กับ 0.4","0.03 กับ 0.04","3 กับ 4","0.5 กับ 0.6"],answer:"0.3 กับ 0.4",hint:"ดูเลขหลักส่วนสิบก่อน แล้วดูว่าเกินไปอีกนิดหน่อย",explain:"0.35 มากกว่า 0.3 แต่ยังไม่ถึง 0.4"},{ask:"ลูกศรชี้ที่จำนวนใด?",visual:{kind:"line",lo:1,step:.1,mark:1.6,dp:1},type:"input",answer:"1.6",hint:"ปลายซ้ายของเส้นนี้ไม่ใช่ 0 แต่เป็น 1",explain:"เริ่มที่ 1 นับไป 6 ขีด ได้ 1.6"}]}]},{id:7,name:"เปรียบเทียบและเรียงลำดับ",goal:"เปรียบเทียบทศนิยมได้ถูกต้อง และแก้ความเข้าใจผิดที่พบบ่อย",emoji:"⚖️",classroom:"ตวงน้ำใส่แก้วตวงสองใบ ให้เด็กเดาก่อนว่าใบไหนมากกว่า แล้วค่อยอ่านตัวเลขจริง",steps:[{kind:"P",title:"เครื่องเปรียบเทียบ",body:["วางตัวเลขสองจำนวนให้จุดตรงกัน แล้วเทียบทีละหลักจากซ้ายไปขวา","กด “เปลี่ยนคู่ตัวเลข” ดูให้ครบทุกคู่ โดยเฉพาะคู่แรก"],widget:{name:"CompareTool"},examples:[{show:"0.9 กับ 0.15",say:"เติมศูนย์เป็น 0.90 กับ 0.15 แล้วเทียบหลักส่วนสิบ 9 กับ 1"},{show:"1.2 กับ 1.08",say:"จำนวนเต็มเท่ากัน จึงไปเทียบหลักส่วนสิบ 2 กับ 0"}],tip:"ถ้าทศนิยมยาวไม่เท่ากัน ให้เติมศูนย์ท้ายให้ยาวเท่ากันก่อน แล้วค่อยเทียบ"},{kind:"A",title:"กฎการเปรียบเทียบ 3 ขั้น",body:["ขั้นที่ 1 เทียบจำนวนเต็มหน้าจุดก่อน ถ้าต่างกันก็ตัดสินได้เลย","ขั้นที่ 2 ถ้าจำนวนเต็มเท่ากัน ให้เติมศูนย์ท้ายให้ยาวเท่ากัน","ขั้นที่ 3 เทียบทีละหลักจากซ้ายไปขวา หลักแรกที่ต่างกันเป็นตัวตัดสิน"],examples:[{show:"0.9 > 0.15",say:"เติมศูนย์เป็น 0.90 กับ 0.15 → หลักส่วนสิบ 9 มากกว่า 1"},{show:"0.7 = 0.70",say:"เติมศูนย์ท้ายไม่ทำให้ค่าเปลี่ยน"},{show:"2.06 < 2.6",say:"จำนวนเต็มเท่ากัน เทียบส่วนสิบ 0 น้อยกว่า 6"}],warn:"ห้ามเทียบโดยดูว่าตัวเลขหลังจุดยาวกว่าแล้วมากกว่า! 0.15 มีตัวเลขเยอะกว่า แต่น้อยกว่า 0.9"},{kind:"Q",title:"ลองทำเอง",body:[],quiz:[{ask:"0.9 กับ 0.15 จำนวนใดมากกว่า?",type:"choice",options:["0.9","0.15","เท่ากัน","เทียบไม่ได้"],answer:"0.9",hint:"เติมศูนย์ให้ยาวเท่ากันก่อน: 0.90 กับ 0.15",explain:"0.90 มี 9 ส่วนสิบ แต่ 0.15 มีแค่ 1 ส่วนสิบ ดังนั้น 0.9 มากกว่า"},{ask:"เติมเครื่องหมายให้ถูกต้อง: 0.7 ___ 0.70",type:"choice",options:["=",">","<","เทียบไม่ได้"],answer:"=",hint:"ลองนึกถึงตารางร้อยช่อง 7 แถวเต็ม กับ 70 ช่อง",explain:"ศูนย์ท้ายทศนิยมไม่เพิ่มค่า 0.7 = 0.70"},{ask:"เติมเครื่องหมายให้ถูกต้อง: 0.25 ___ 0.3",type:"choice",options:["<",">","=","เทียบไม่ได้"],answer:"<",hint:"เติมศูนย์: 0.25 กับ 0.30 แล้วเทียบหลักส่วนสิบ",explain:"หลักส่วนสิบ 2 น้อยกว่า 3 ดังนั้น 0.25 < 0.3"},{ask:"เรียงจากน้อยไปมาก: 0.5, 0.05, 0.55",type:"choice",options:["0.05, 0.5, 0.55","0.5, 0.05, 0.55","0.55, 0.5, 0.05","0.05, 0.55, 0.5"],answer:"0.05, 0.5, 0.55",hint:"เติมศูนย์ให้ยาวเท่ากันทั้งสามจำนวน: 0.50, 0.05, 0.55",explain:"0.05 < 0.50 < 0.55"},{ask:"เติมเครื่องหมายให้ถูกต้อง: 2.06 ___ 2.6",type:"choice",options:["<",">","=","เทียบไม่ได้"],answer:"<",hint:"จำนวนเต็มเท่ากันทั้งคู่ ให้ไปเทียบหลักส่วนสิบ",explain:"ส่วนสิบของ 2.06 คือ 0 ส่วนสิบของ 2.6 คือ 6 ดังนั้น 2.06 < 2.6"}]}]},{id:8,name:"เศษส่วนกับทศนิยม",goal:"เปลี่ยนเศษส่วนเป็นทศนิยมและเปลี่ยนกลับได้",emoji:"🔄",classroom:"พับกระดาษเป็นครึ่ง เป็นสี่ส่วน แล้วให้เด็กระบายและเขียนทั้งสองแบบกำกับไว้",steps:[{kind:"P",title:"ภาพเดียว สองชื่อ",body:["ระบายตารางร้อยช่องให้ได้ 25 ช่อง 50 ช่อง และ 75 ช่อง","ภาพเดียวกันนี้ เรียกได้ทั้งแบบเศษส่วนและแบบทศนิยม"],widget:{name:"HundredGrid",props:{start:25}},examples:[{show:"ระบาย 50 ช่อง",say:"50/100 = 1/2 = 0.5"},{show:"ระบาย 25 ช่อง",say:"25/100 = 1/4 = 0.25"},{show:"ระบาย 20 ช่อง",say:"20/100 = 1/5 = 0.2"}],tip:"ระบาย 25 ช่อง = 25/100 ซึ่งก็คือ 1 ใน 4 ของตาราง = 0.25"},{kind:"A",title:"วิธีเปลี่ยนไปมา",body:["เศษส่วน → ทศนิยม: ทำตัวส่วนให้เป็น 10, 100 หรือ 1,000 ก่อน","ทศนิยม → เศษส่วน: นับตัวเลขหลังจุด 1 ตัวได้ส่วน 10, 2 ตัวได้ส่วน 100, 3 ตัวได้ส่วน 1,000"],examples:[{show:"1/2 = 5/10 = 0.5",say:"คูณทั้งเศษและส่วนด้วย 5 ให้ส่วนเป็น 10"},{show:"1/4 = 25/100 = 0.25",say:"คูณทั้งเศษและส่วนด้วย 25 ให้ส่วนเป็น 100"},{show:"3/5 = 6/10 = 0.6",say:"คูณทั้งเศษและส่วนด้วย 2 ให้ส่วนเป็น 10"},{show:"0.75 = 75/100 = 3/4",say:"หลังจุด 2 ตัว จึงเป็นส่วน 100 แล้วทอนลง"}],warn:"จำเป็นชุดให้ขึ้นใจ: 1/2 = 0.5, 1/4 = 0.25, 3/4 = 0.75, 1/5 = 0.2, 1/10 = 0.1"},{kind:"G",title:"เกมจับคู่",body:["แตะการ์ดเศษส่วนก่อน แล้วแตะทศนิยมที่มีค่าเท่ากัน จับให้ครบทุกคู่"],widget:{name:"MatchGame"}},{kind:"Q",title:"ลองทำเอง",body:[],quiz:[{ask:"1/2 เขียนเป็นทศนิยมได้เท่าไร?",type:"input",answer:"0.5",hint:"ทำตัวส่วนให้เป็น 10 โดยคูณทั้งเศษและส่วนด้วย 5",explain:"1/2 = 5/10 = 0.5"},{ask:"1/4 เขียนเป็นทศนิยมได้เท่าไร?",type:"input",answer:"0.25",hint:"ทำตัวส่วนให้เป็น 100 โดยคูณทั้งเศษและส่วนด้วย 25",explain:"1/4 = 25/100 = 0.25"},{ask:"0.75 เขียนเป็นเศษส่วนอย่างต่ำได้เท่าไร?",type:"choice",options:["3/4","75/10","7/5","1/4"],answer:"3/4",hint:"หลังจุด 2 ตัว จึงเป็น 75/100 แล้วหารทั้งเศษและส่วนด้วย 25",explain:"0.75 = 75/100 = 3/4"},{ask:"3/5 เขียนเป็นทศนิยมได้เท่าไร?",type:"input",answer:"0.6",hint:"5 คูณด้วยเท่าไรจึงได้ 10? แล้วต้องคูณตัวเศษด้วยเท่ากัน",explain:"3/5 = 6/10 = 0.6"},{ask:"ภาพนี้เท่ากับเศษส่วนและทศนิยมใด?",visual:{kind:"grid",n:25},type:"choice",options:["1/4 = 0.25","1/2 = 0.5","2/5 = 0.4","1/4 = 0.4"],answer:"1/4 = 0.25",hint:"นับช่องที่ระบายก่อน แล้วเทียบกับ 100 ช่องทั้งหมด",explain:"ระบาย 25 ช่องจาก 100 ช่อง = 25/100 = 1/4 = 0.25"}]}]},{id:9,name:"บวก ลบ และโจทย์ปัญหา",goal:"บวกลบทศนิยมโดยตั้งจุดให้ตรงกัน และแก้โจทย์ปัญหาในชีวิตจริง",emoji:"🛒",classroom:"จำลองร้านค้าในห้องเรียน ติดป้ายราคาที่เป็นทศนิยม ให้เด็กซื้อของและทอนเงินจริง",steps:[{kind:"C",title:"ไปจ่ายตลาด",body:["หยอดเหรียญให้ได้เท่ากับราคาของที่อยากซื้อ เช่น 12.50 บาท","ลองซื้อสองอย่างแล้วดูว่ารวมกันได้เท่าไร"],widget:{name:"MoneyBoard"},examples:[{show:"12.50 บาท",say:"เหรียญบาท 12 เหรียญ กับอีก 50 สตางค์"},{show:"8.75 บาท",say:"เหรียญบ
